<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Немедленный редирект до загрузки Nuxt - выполняется синхронно, БЕЗ задержки
    (function() {
      var host = window.location.host || '';
      if (host.indexOf('emiratesfashionweeks.com') !== -1) {
        var protocol = window.location.protocol || 'https:';
        var newHost = 'www.emiratesfashionweek.com';
        var pathname = window.location.pathname || '/';
        var search = window.location.search || '';
        // Используем location.href для немедленного редиректа
        window.location.href = protocol + '//' + newHost + pathname + search;
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://www.emiratesfashionweek.com/">
  </noscript>
</head>
<body></body>
</html>
